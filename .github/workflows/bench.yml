name: Bench

# A live benchmark run on demand (R-6.10.15): `devtool bench` against the e2e
# test drive, its result bundle uploaded as an artifact. It runs on manual
# dispatch only, never on a push, a pull request or the schedule: benchmark
# numbers are evidence a person asks for, not a gate.
#
# The credential steps are the e2e job's of ci.yml, duplicated rather than
# shared through a composite action: TestBenchWorkflowHoldsItsContract and
# TestCIWorkflowSetsNoTestDriveInJobEnv read a live job's steps from its
# workflow file, and the pin rule reads only the files under
# .github/workflows, so a step moved into .github/actions would leave both
# checks.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Benchmark scenario'
        type: choice
        options:
          - sync-bidirectional-catchup-100m
          - startup-empty-config
        default: sync-bidirectional-catchup-100m
      runs:
        description: 'Measured samples (-1 uses the scenario default)'
        type: string
        default: '-1'
      warmup:
        description: 'Warmup samples (-1 uses the scenario default)'
        type: string
        default: '-1'

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    # The live scenario's default run: the remote fixture's preparation (a
    # 100 MiB upload of 2668 files, under 30 minutes), three samples (a
    # server-side copy, a baseline sync, 96 remote mutations, a delta wait of
    # at most 3 minutes and the measured sync each, under 30 minutes), the
    # remote cleanup (at most 5 minutes) and setup, with room for a slow
    # provider day. A dispatch asking for more samples may need more.
    timeout-minutes: 180
    # The e2e jobs' group: the benchmark uses their test drive, and the
    # e2e preflight scrub deletes the benchmark's folder, so the two never
    # run at once. A queued run waits; none is canceled.
    concurrency:
      group: live-account-e2e
      cancel-in-progress: false
    # The `live` environment holds the Azure variables, and the Entra app
    # trusts only this repository's `live` environment (an immutable OIDC
    # subject), so only a job that names it can read the vault.
    environment: live
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_KEY_VAULT: ${{ vars.AZURE_KEY_VAULT }}
    permissions:
      contents: read
      id-token: write # OIDC federation with Azure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This repository's logs are public, and GitHub prints a step's env
      # values in its header, so the test drives and the account allowlist
      # are no repository variables: they live in Key Vault, and this step,
      # which only the checkout precedes, names each by
      # its vault secret. scripts/ci-mask-test-drives.sh reads them, masks
      # each value and every spelling of it the job or the benchmark can print,
      # lists those spellings for the artifact redaction, and exports the
      # values and each drive's vault secret and token file names through
      # GITHUB_ENV, whose headers then show ***.
      - name: Mask the test drive and the account allowlist
        env:
          ONEDRIVE_TEST_DRIVE_FROM_VAULT: onedrive-test-drive-e2e
          ONEDRIVE_ALLOWED_TEST_ACCOUNTS_FROM_VAULT: onedrive-test-allowed-accounts
        run: ./scripts/ci-mask-test-drives.sh

      # Live jobs disable setup-go cache restore because toolchain tar extraction
      # conflicts during cache replay can break the job before tests start.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The benchmark writes its own config for every sample; it needs the
      # inventory catalog and the drive's token.
      - name: Download credentials to .testdata/
        run: |
          set -euo pipefail
          mkdir -p .testdata

          bash scripts/ci-keyvault.sh download "onedrive-test-catalog" ".testdata/catalog.json"

          # Download the token of this job's drive, under the secret and file
          # names the masking script exported. This repository's logs are
          # public: name the variable, never the drive, the secret or the
          # token file, which all embed the account.
          echo "Downloading the token of ONEDRIVE_TEST_DRIVE"
          bash scripts/ci-keyvault.sh download "${ONEDRIVE_TEST_DRIVE_VAULT_SECRET}" ".testdata/${ONEDRIVE_TEST_DRIVE_TOKEN_FILE}"

          echo "=== .testdata/ holds $(find .testdata -type f | wc -l) files ==="

      # The inputs reach the script through env, never spliced into it.
      # The result bundle goes into the one directory this job redacts and
      # uploads from.
      - name: Run the benchmark
        env:
          BENCH_SCENARIO: ${{ inputs.scenario }}
          BENCH_RUNS: ${{ inputs.runs }}
          BENCH_WARMUP: ${{ inputs.warmup }}
        run: |
          set -euo pipefail
          for count in "${BENCH_RUNS}" "${BENCH_WARMUP}"; do
            if ! [[ "${count}" =~ ^(-1|[0-9]+)$ ]]; then
              echo "::error::runs and warmup must be -1 or a count, got '${count}'"
              exit 1
            fi
          done
          mkdir -p /tmp/bench-results
          go run ./cmd/devtool bench \
            --scenario "${BENCH_SCENARIO}" \
            --runs "${BENCH_RUNS}" \
            --warmup "${BENCH_WARMUP}" \
            --result-json /tmp/bench-results/result.json

      # Masking covers the log, not the artifacts: every spelling the masking
      # script listed is replaced by *** in the results directory before it
      # is uploaded. The bundle names the remote fixture by its benchmark
      # paths, never the drive, but a failed sample's excerpt quotes the
      # CLI's output.
      - name: Redact the test drive and accounts in the benchmark result
        if: always()
        run: |
          set -euo pipefail
          export MASKS="${RUNNER_TEMP}/onedrive-test-masks"
          if [ ! -s "${MASKS}" ] || [ ! -d /tmp/bench-results ]; then
            exit 0
          fi
          find /tmp/bench-results -type f -exec perl -pi -e '
            BEGIN {
              open(my $list, "<", $ENV{MASKS}) or die "read $ENV{MASKS}: $!";
              my @spellings = grep { length } map { chomp; $_ } <$list>;
              $pattern = join "|", map { quotemeta } sort { length($b) <=> length($a) } @spellings;
            }
            s/$pattern/***/g if length $pattern;
          ' {} +

      - name: Upload the benchmark result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-result
          path: /tmp/bench-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Save rotated token to Key Vault
        if: always()
        run: |
          set -euo pipefail
          TOKEN_PATH=".testdata/${ONEDRIVE_TEST_DRIVE_TOKEN_FILE}"
          if [ -z "${ONEDRIVE_TEST_DRIVE_VAULT_SECRET:-}" ] || [ ! -f "$TOKEN_PATH" ]; then
            echo "::warning::Token file of ONEDRIVE_TEST_DRIVE missing — skipping save"
            exit 0
          fi

          echo "Saving rotated token for ONEDRIVE_TEST_DRIVE"
          bash scripts/ci-keyvault.sh upload "${ONEDRIVE_TEST_DRIVE_VAULT_SECRET}" "$TOKEN_PATH"
