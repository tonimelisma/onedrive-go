name: CI

on:
  push:
    branches: [main]
  # Every PR, whatever its base, so a stacked PR gets CI before the PR under it
  # merges and retargets it to main.
  pull_request:
  workflow_dispatch:
  schedule:
    # 10:00 UTC: 03:00 Pacific daylight time, 02:00 standard time.
    - cron: '0 10 * * *'

# Cancel stale PR runs; never cancel push, scheduled or manual runs.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default. id-token: write is granted per-job to the two
# live-API jobs that federate with Azure; the verify and stress jobs never
# need it.
permissions:
  contents: read

# Two tiers (R-6.10.22).
#
# The PR lane runs on every pull request and on every push to main, as
# parallel jobs whose slowest member is the critical path: `verify-lint`,
# and `verify-unit`, a matrix of Linux `verify quick` shards and macOS
# `verify platform` shards. `quick` is format, the repository rules, the
# builds, the tagged vets and the short unit tier (`go test -short`: no race
# detector, no coverage profile, no exhaustive tests); `platform` is the host
# build plus the same short tier. The aggregate `verify` job is the required
# check. Push to main is not skipped for squash merges any more: branch
# protection no longer requires a PR branch to be up to date, so a merge of
# a stale branch can break main, and the push run is what catches it within
# minutes.
#
# The full tier runs nightly and on manual dispatch: `verify public` on both
# platforms (race detector, the coverage gate at the number R-6.10.4 states,
# every exhaustive test), `stress` (race repetition of ./internal/multisync
# and the ./internal/sync/... tree), and the live `e2e-full` profile. A data
# race or a coverage drop can therefore reach main and be caught by the next
# nightly run; that is the trade-off for a three-minute PR lane. Locally, the
# DoD pre-pr stage runs the `pr` profile (lint, then quick), and
# `verify default` still runs the full unit tier.
#
# The live jobs (`integration`, `e2e`) run on pull requests, dispatch and the
# schedule, never on push to main: their shared test accounts serialize runs,
# the PR run already exercised the change, and the nightly covers main.
jobs:
  verify-lint:
    runs-on: ubuntu-latest
    # Above the linter's own 15-minute deadline, so a lint that hangs ends
    # with the linter's message instead of a job timeout that names no cause.
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          install-only: true

      # Vulnerability scanning sits beside lint, off the test shards' critical
      # path. The module graph is platform-independent and the check is about
      # dependencies, not the host. It fails the build on a vulnerability this
      # code actually reaches, which is the signal worth blocking on.
      - name: govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Lint
        run: go run ./cmd/devtool verify lint

  # README lists Linux and macOS as primary platforms, and the tree carries
  # darwin-only sources (synctree stat identity, the non-Linux watcher path).
  # Both legs run so neither platform can break unobserved. The unit tier is
  # sharded by test name (`verify_quick.go`): the shards of one count partition
  # every test, so each job runs its slice and together they run everything.
  verify-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # One job per entry, on each OS. To grow the lane, add entries of the
        # next count ("1/4" .. "4/4"): the count is read from the entries.
        shard: ["1/3", "2/3", "3/3"]
    runs-on: ${{ matrix.os }}
    # Above devtool's 10-minute short-tier go test deadline plus the builds, so
    # the test deadline, not the job, ends a slow run.
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    env:
      VERIFY_SHARD: ${{ matrix.shard }}
    steps:
      # How long the test tiers take, and the full tier's go test deadline
      # (20 minutes on 3 cores and more, 180 core-minutes divided by the cores
      # below that), depend on the runner's cores, so the log says how many
      # this one had.
      - name: Runner cores
        run: |
          echo "runner cores: $(getconf _NPROCESSORS_ONLN)"

      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install format tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          go install mvdan.cc/gofumpt@v0.9.2
          go install golang.org/x/tools/cmd/goimports@v0.41.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # --check-format lists what the formatters would change and fails on it;
      # without it the format step rewrites the checkout and cannot fail.
      - name: Verify quick (format, repository rules, builds, short unit tier)
        if: matrix.os == 'ubuntu-latest'
        run: go run ./cmd/devtool verify quick --check-format --shard "${VERIFY_SHARD}"

      # The macOS leg exists to catch darwin-only build and behavior breakage;
      # the repository rules are platform-independent and already ran on Linux.
      - name: Verify platform (host build, short unit tier)
        if: matrix.os == 'macos-latest'
        run: go run ./cmd/devtool verify platform --shard "${VERIFY_SHARD}"

  # Nightly and on-demand full tier: the public profile with the race detector,
  # the coverage gate and every exhaustive test, on both platforms.
  verify-full:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Above devtool's 20-minute go test deadline plus lint, build and the
    # coverage gate, so the test deadline, not the job, ends a slow run.
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      # How long the test tiers take, and the full tier's go test deadline
      # (20 minutes on 3 cores and more, 180 core-minutes divided by the cores
      # below that), depend on the runner's cores, so the log says how many
      # this one had.
      - name: Runner cores
        run: |
          echo "runner cores: $(getconf _NPROCESSORS_ONLN)"

      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install format tools
        run: |
          set -euo pipefail
          go install mvdan.cc/gofumpt@v0.9.2
          go install golang.org/x/tools/cmd/goimports@v0.41.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          install-only: true

      - name: govulncheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      # The coverage gate is a single authoritative number, measured across
      # packages (-coverpkg=./...) and stated only in requirement R-6.10.4,
      # which devtool reads; this file carries no copy of it. Only the Linux
      # leg enforces it. The macOS leg runs the same suite with coverage
      # reported but not gated: it compiles a different build-tagged file set
      # and would legitimately land on a different percentage. The condition
      # is written with != on purpose: `cond && '' || 'x'` yields 'x' when cond
      # is true, because the empty string is falsy.
      - name: Verify public
        env:
          COVERAGE_ARGS: ${{ matrix.os != 'ubuntu-latest' && '--coverage-threshold -1' || '' }}
        run: go run ./cmd/devtool verify public ${COVERAGE_ARGS} --check-format --summary-json "${RUNNER_TEMP}/verify-full-summary.json"

      - name: Upload verify-full summary
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verify-full-summary-${{ matrix.os }}
          path: ${{ runner.temp }}/verify-full-summary.json
          if-no-files-found: warn
          retention-days: 7

  # Branch protection requires a check literally named "verify". Pointing it at
  # a matrix job does not work: the legs report as "verify-unit (ubuntu-latest,
  # 1/3)" and so on, so the required name never appears and every PR stays
  # blocked forever. This aggregate keeps the required name stable and
  # independent of how many jobs and shards the lane grows. It waits on every
  # tier: on a PR or a push the full tier is skipped by its own condition, on
  # the schedule the PR lane is, and a skipped job is not a failure. A run in
  # which nothing at all ran is.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [verify-lint, verify-unit, verify-full]
    if: always()
    steps:
      - name: Require every verify job that ran to succeed
        env:
          LINT_RESULT: ${{ needs.verify-lint.result }}
          UNIT_RESULT: ${{ needs.verify-unit.result }}
          FULL_RESULT: ${{ needs.verify-full.result }}
        run: |
          set -euo pipefail
          echo "verify-lint: ${LINT_RESULT}; verify-unit: ${UNIT_RESULT}; verify-full: ${FULL_RESULT}"
          ran=0
          for result in "${LINT_RESULT}" "${UNIT_RESULT}" "${FULL_RESULT}"; do
            case "${result}" in
              success) ran=1 ;;
              skipped) ;;
              *) echo "::error::a verify job did not succeed (${result})"; exit 1 ;;
            esac
          done
          if [ "${ran}" -eq 0 ]; then
            echo "::error::no verify job ran"
            exit 1
          fi

  stress:
    runs-on: ubuntu-latest
    # Above the sum of the stress steps' go test deadlines (20m + 40m + 40m)
    # plus setup, so a hung test ends at its own deadline, with a goroutine
    # dump and a summary, not at the job's (TestCIJobTimeoutsCoverEveryGoTestDeadline).
    timeout-minutes: 120
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7.0.1

      # Stress runs disable setup-go cache restore because toolchain cache
      # replay failures can break the job before tests start.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Stress verify
        run: go run ./cmd/devtool verify stress --summary-json "${RUNNER_TEMP}/stress-verify-summary.json"

      - name: Upload stress summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: stress-summaries
          path: ${{ runner.temp }}/stress-verify-summary.json
          if-no-files-found: warn
          retention-days: 7

  # --- Live API jobs (skip on forks — no OIDC trust; never on push to main) ---
  # Each job uses its own dedicated test account so the two jobs run in
  # parallel without OAuth token refresh races.

  # Each live job's account is shared by every run of that job, across PRs and
  # manual dispatches. Two runs at once scrub and mutate the same drive and
  # fail each other, so runs of one job queue instead of overlapping.
  # GitHub keeps one pending run per group; a third arrival cancels the older
  # pending one, which is rerun rather than raced.
  integration:
    runs-on: ubuntu-latest
    # The profile's one go test deadline, 5 minutes, plus the 10 minutes of
    # setup every job's timeout allows (TestCIJobTimeoutsCoverEveryGoTestDeadline):
    # exactly that need, because this number sets the pull request's DoD
    # stall window. Recent runs take about 2 minutes (1.6 to 2.4 over twenty
    # pull request, dispatch and nightly runs).
    timeout-minutes: 15
    concurrency:
      group: live-account-integration
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC federation with Azure
    if: vars.AZURE_CLIENT_ID != '' && github.event_name != 'push'
    steps:
      - uses: actions/checkout@v7.0.1

      # This repository's logs are public, and GitHub prints a job-level env
      # value in the header of every step, so the test drives and the account
      # allowlist come into this job here only, right after the checkout:
      # scripts/ci-mask-test-drives.sh masks every spelling of them the job or
      # its tests can print, lists those spellings for the artifact
      # redaction, and exports the values and each drive's vault secret and
      # token file names through GITHUB_ENV, whose headers then show ***.
      # While they are repository variables, this step's header still shows
      # the values once; a repository secret of the same name takes precedence
      # and removes that last occurrence too.
      - name: Mask the test drive and the account allowlist
        env:
          ONEDRIVE_TEST_DRIVE: ${{ secrets.ONEDRIVE_TEST_DRIVE_INTEGRATION || vars.ONEDRIVE_TEST_DRIVE_INTEGRATION }}
          ONEDRIVE_ALLOWED_TEST_ACCOUNTS: ${{ secrets.ONEDRIVE_ALLOWED_TEST_ACCOUNTS || vars.ONEDRIVE_ALLOWED_TEST_ACCOUNTS }}
        run: ./scripts/ci-mask-test-drives.sh

      # Live jobs disable setup-go cache restore because toolchain tar extraction
      # conflicts during cache replay can break the job before tests start.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: go build ./...

      - name: Azure OIDC login (attempt 1)
        id: azure_login_integration
        uses: azure/login@v3.1.0
        continue-on-error: true
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Azure OIDC login (retry)
        if: steps.azure_login_integration.outcome == 'failure'
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download credentials to .testdata/
        run: |
          set -euo pipefail
          mkdir -p .testdata

          az keyvault secret download \
            --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" \
            --name "onedrive-test-catalog" \
            --file ".testdata/catalog.json" \
            --encoding utf-8

          # Download config.
          az keyvault secret download \
            --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" \
            --name "onedrive-test-config" \
            --file ".testdata/config.toml" \
            --encoding utf-8

          # Download the token of this job's drive, under the secret and file
          # names the masking script exported. This repository's logs are
          # public: name the variable, never the drive, the secret or the
          # token file, which all embed the account.
          echo "Downloading the token of ONEDRIVE_TEST_DRIVE"
          az keyvault secret download \
            --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" \
            --name "${ONEDRIVE_TEST_DRIVE_VAULT_SECRET}" \
            --file ".testdata/${ONEDRIVE_TEST_DRIVE_TOKEN_FILE}" \
            --encoding utf-8

          echo "=== .testdata/ holds $(find .testdata -type f | wc -l) files ==="

      - name: Run integration tests
        run: |
          set -euo pipefail
          go run ./cmd/devtool verify integration

      - name: Save rotated token to Key Vault
        if: always()
        run: |
          set -euo pipefail
          TOKEN_PATH=".testdata/${ONEDRIVE_TEST_DRIVE_TOKEN_FILE}"

          if [ ! -f "$TOKEN_PATH" ]; then
            echo "::warning::Token file missing — skipping save"
            exit 0
          fi

          echo "Saving rotated token"
          az keyvault secret set \
            --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" \
            --name "${ONEDRIVE_TEST_DRIVE_VAULT_SECRET}" \
            --file "$TOKEN_PATH" \
            --content-type "application/json" \
            --output none

  e2e:
    runs-on: ubuntu-latest
    # Per event, the sum of every go test deadline the job's profile can start,
    # plus setup (TestCIJobTimeoutsCoverEveryGoTestDeadline). A pull request
    # runs the fast tier, three 10-minute deadlines, and its 40 minutes are
    # exactly that need, because this number sets the pull request's DoD
    # stall window. The schedule and manual dispatch run e2e-full: every
    # bucket runs even after one fails, so the deadlines add up, and with the
    # three classified reruns and setup they fit inside 180. A healthy nightly
    # takes about 40 minutes; only hangs come near it. A zero would turn the
    # expression into its fallback.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 40 || 180 }}
    concurrency:
      group: live-account-e2e
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC federation with Azure
    if: vars.AZURE_CLIENT_ID != '' && github.event_name != 'push'
    steps:
      - uses: actions/checkout@v7.0.1

      # This repository's logs are public, and GitHub prints a job-level env
      # value in the header of every step, so the test drives and the account
      # allowlist come into this job here only, right after the checkout:
      # scripts/ci-mask-test-drives.sh masks every spelling of them the job or
      # its tests can print, lists those spellings for the artifact
      # redaction, and exports the values and each drive's vault secret and
      # token file names through GITHUB_ENV, whose headers then show ***.
      # While they are repository variables, this step's header still shows
      # the values once; a repository secret of the same name takes precedence
      # and removes that last occurrence too.
      - name: Mask the test drives and the account allowlist
        env:
          ONEDRIVE_TEST_DRIVE: ${{ secrets.ONEDRIVE_TEST_DRIVE_E2E || vars.ONEDRIVE_TEST_DRIVE_E2E }}
          ONEDRIVE_TEST_DRIVE_2: ${{ secrets.ONEDRIVE_TEST_DRIVE_E2E_2 || vars.ONEDRIVE_TEST_DRIVE_E2E_2 }}
          ONEDRIVE_ALLOWED_TEST_ACCOUNTS: ${{ secrets.ONEDRIVE_ALLOWED_TEST_ACCOUNTS || vars.ONEDRIVE_ALLOWED_TEST_ACCOUNTS }}
          # Which drive holds each shortcut fixture, by variable name, never
          # by value: the script exports the fixture variables from them.
          ONEDRIVE_TEST_SHORTCUT_READONLY_PARENT_DRIVE_FROM: ONEDRIVE_TEST_DRIVE
          ONEDRIVE_TEST_SHORTCUT_WRITABLE_PARENT_DRIVE_FROM: ONEDRIVE_TEST_DRIVE_2
        run: ./scripts/ci-mask-test-drives.sh

      # Live jobs disable setup-go cache restore because toolchain tar extraction
      # conflicts during cache replay can break the job before tests start.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Azure OIDC login (attempt 1)
        id: azure_login_e2e
        uses: azure/login@v3.1.0
        continue-on-error: true
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Azure OIDC login (retry)
        if: steps.azure_login_e2e.outcome == 'failure'
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download credentials to .testdata/
        run: |
          set -euo pipefail
          mkdir -p .testdata

          az keyvault secret download \
            --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" \
            --name "onedrive-test-catalog" \
            --file ".testdata/catalog.json" \
            --encoding utf-8

          # Download config.
          az keyvault secret download \
            --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" \
            --name "onedrive-test-config" \
            --file ".testdata/config.toml" \
            --encoding utf-8

          az keyvault secret download \
            --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" \
            --name "onedrive-test-fixtures-env" \
            --file ".testdata/fixtures.env" \
            --encoding utf-8

          # Download token files for each test drive, under the secret and file
          # names the masking script exported; shared inventory comes from
          # catalog.json.
          for DRIVE_VAR in ONEDRIVE_TEST_DRIVE ONEDRIVE_TEST_DRIVE_2; do
            SECRET_VAR="${DRIVE_VAR}_VAULT_SECRET"
            TOKEN_VAR="${DRIVE_VAR}_TOKEN_FILE"
            if [ -z "${!SECRET_VAR:-}" ]; then
              continue
            fi

            # Public logs: name the variable, never the drive, the secret or
            # the token file, which all embed the account.
            echo "Downloading the token of ${DRIVE_VAR}"
            az keyvault secret download \
              --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" \
              --name "${!SECRET_VAR}" \
              --file ".testdata/${!TOKEN_VAR}" \
              --encoding utf-8
          done

          echo "=== .testdata/ holds $(find .testdata -type f | wc -l) files ==="

      - name: Run E2E tests
        run: |
          set -euo pipefail
          # Pull requests run the fast smoke lane; the nightly schedule and
          # manual dispatch run the full live suite.
          profile=e2e
          # The summary goes into the debug log directory, the one directory
          # this job redacts and uploads from.
          extra_args=(--summary-json /tmp/e2e-debug-logs/e2e-verify-summary.json)
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            profile=e2e-full
            extra_args+=(--classify-live-quirks)
          fi
          go run ./cmd/devtool verify "$profile" --e2e-log-dir /tmp/e2e-debug-logs "${extra_args[@]}"

      # Masking covers the log, not the artifacts. The e2e recorders write
      # drive roles instead of drive identifiers; as a second layer every
      # spelling the masking script listed is replaced by *** in the debug
      # log directory before it is uploaded. Every artifact this job uploads
      # comes from that directory; a test failure message that quotes the
      # CLI's own output reaches only the job log, which the masks cover.
      - name: Redact the test drives and accounts in the E2E artifacts
        if: always()
        run: |
          set -euo pipefail
          export MASKS="${RUNNER_TEMP}/onedrive-test-masks"
          if [ ! -s "${MASKS}" ] || [ ! -d /tmp/e2e-debug-logs ]; then
            exit 0
          fi
          find /tmp/e2e-debug-logs -type f -exec perl -pi -e '
            BEGIN {
              open(my $list, "<", $ENV{MASKS}) or die "read $ENV{MASKS}: $!";
              my @spellings = grep { length } map { chomp; $_ } <$list>;
              $pattern = join "|", map { quotemeta } sort { length($b) <=> length($a) } @spellings;
            }
            s/$pattern/***/g if length $pattern;
          ' {} +

      - name: Upload E2E summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-summaries
          path: |
            /tmp/e2e-debug-logs/timing-summary.json
            /tmp/e2e-debug-logs/quirk-summary.json
            /tmp/e2e-debug-logs/e2e-verify-summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload E2E debug logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-debug-logs
          path: /tmp/e2e-debug-logs/
          retention-days: 7

      - name: Save rotated tokens to Key Vault
        if: always()
        run: |
          set -euo pipefail
          for DRIVE_VAR in ONEDRIVE_TEST_DRIVE ONEDRIVE_TEST_DRIVE_2; do
            SECRET_VAR="${DRIVE_VAR}_VAULT_SECRET"
            TOKEN_VAR="${DRIVE_VAR}_TOKEN_FILE"
            if [ -z "${!SECRET_VAR:-}" ]; then
              continue
            fi

            TOKEN_PATH=".testdata/${!TOKEN_VAR}"
            if [ ! -f "$TOKEN_PATH" ]; then
              echo "::warning::Token file for ${DRIVE_VAR} missing — skipping save"
              continue
            fi

            echo "Saving rotated token for ${DRIVE_VAR}"
            az keyvault secret set \
              --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" \
              --name "${!SECRET_VAR}" \
              --file "$TOKEN_PATH" \
              --content-type "application/json" \
              --output none
          done

      - name: Auth failure guidance
        if: failure()
        run: |
          echo "::warning::E2E test auth may have failed."
          echo "::warning::If the refresh token has expired (90 days idle), re-bootstrap."
          echo "::warning::See CLAUDE.md 'Test credential pipeline' for re-bootstrap instructions."
