version: "2"

run:
  # The deadline of a linter started by hand. `devtool verify` passes its own
  # --timeout over this one: this value on a host with at least 3 cores, and a
  # longer one below, where a cold whole-repo run beside other work has taken
  # more than 15 minutes. A devtool test keeps the two base values equal.
  timeout: 15m
  modules-download-mode: readonly
  # Live-test code is build-tagged; without these tags lint never sees it.
  build-tags:
    - e2e
    - e2e_full
    - integration

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/tonimelisma/onedrive-go

linters:
  default: none
  enable:
    - bodyclose
    - containedctx
    - copyloopvar
    - contextcheck
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - loggercheck
    - misspell
    - mnd
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - tagliatelle
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - whitespace
    - wrapcheck

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment

    depguard:
      rules:
        main:
          files:
            - "**/*.go"
          allow:
            - $gostd
            - github.com/tonimelisma/onedrive-go
            - github.com/BurntSushi/toml
            - github.com/stretchr/testify
            - golang.org/x/oauth2
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            - github.com/inconshreveable/mousetrap
            - golang.org/x/text
            - golang.org/x/time
            - modernc.org/sqlite
            - modernc.org/libc
            - modernc.org/mathutil
            - modernc.org/memory
            - github.com/pressly/goose/v3
            - github.com/google/uuid
            - github.com/fsnotify/fsnotify
            - github.com/coder/websocket
            - golang.org/x/sync
            - github.com/mattn/go-isatty
            - golang.org/x/sys
        # depguard matches files patterns against each file's absolute path,
        # so a path-scoped rule names its files from "**/"; a pattern relative
        # to the repository never matches and leaves its rule off
        # (TestGolangciConfig_DepguardFilePatternsMatchAbsolutePaths), and so
        # does one naming a folder that holds no package
        # (TestGolangciConfig_DepguardPackagePatternsNameExistingPackages).
        graph-no-config:
          files:
            - "**/internal/graph/*.go"
            - "!$test"
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/config$
              desc: graph boundary must not import internal/config
        driveops-no-sync:
          files:
            - "**/internal/driveops/*.go"
            - "!$test"
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync$
              desc: driveops must not import internal/sync
        multisync-no-graph:
          files:
            - "**/internal/multisync/*.go"
            - "!$test"
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/graph$
              desc: multisync owns runner lifecycle only and must not call Graph directly
        # Every package that imports no internal package is held to it.
        leaf-internal:
          files:
            - "**/internal/authstate/*.go"
            - "**/internal/driveid/*.go"
            - "**/internal/errclass/*.go"
            - "**/internal/localpath/*.go"
            - "**/internal/loglevel/*.go"
            - "**/internal/namekey/*.go"
            - "**/internal/panicguard/*.go"
            - "**/internal/sdnotify/*.go"
            - "**/internal/sharedref/*.go"
            - "!$test"
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/
              desc: leaf packages must not import other internal packages
        # A package with one internal dependency is held to that one. In lax
        # mode an import is refused when a deny prefix matches it, unless an
        # allow entry matches it with a longer prefix, so the exact allow below
        # wins over the internal/ deny for that one package alone.
        tokenfile-only-fsroot:
          list-mode: lax
          files:
            - "**/internal/tokenfile/*.go"
            - "!$test"
          allow:
            - github.com/tonimelisma/onedrive-go/internal/fsroot$
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/
              desc: tokenfile imports no internal package but fsroot, through which every token file is read and written
        retry-only-perf:
          list-mode: lax
          files:
            - "**/internal/retry/*.go"
            - "!$test"
          allow:
            - github.com/tonimelisma/onedrive-go/internal/perf$
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/
              desc: retry imports no internal package but perf, which counts its retries
        fsroot-only-localpath:
          list-mode: lax
          files:
            - "**/internal/fsroot/*.go"
            - "!$test"
          allow:
            - github.com/tonimelisma/onedrive-go/internal/localpath$
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/
              desc: fsroot imports no internal package but localpath, for its directory-sync errno test and its one-line join of two failures
        # The verification tool, tests included, imports no product package:
        # the allow entry is longer than the deny, so lax mode passes
        # internal/devtool, which cmd/devtool runs, and that alone.
        devtool-no-product:
          list-mode: lax
          files:
            - "**/internal/devtool/**"
            - "**/cmd/devtool/**"
          allow:
            - github.com/tonimelisma/onedrive-go/internal/devtool$
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/
              desc: the verification tool must not link product packages

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.(Open|OpenFile|ReadFile|WriteFile|Create|CreateTemp|Mkdir|MkdirAll|ReadDir|Stat|Lstat|Remove|RemoveAll|Rename|Chmod|Chtimes|Symlink|Readlink|Truncate)$
          msg: use fsroot, synctree, or localpath filesystem boundaries instead of raw os.* calls
        - pattern: ^time\.Sleep$
          msg: use explicit test synchronization instead of wall-clock sleep
        # Every byte of JSON a command prints is encoded in
        # internal/cli/json_output.go (writeJSONDocument, writeJSONLine). The
        # exclusion rules below scope this to the non-test files of
        # internal/cli and name its exceptions.
        - pattern: ^json\.(NewEncoder|Marshal|MarshalIndent)$
          pkg: ^encoding/json$
          msg: encode command output only through writeJSONDocument or writeJSONLine in internal/cli/json_output.go
        - pattern: ^synctree\.Root\.(WithoutNoReplaceFlagOrHardLinks|WithoutNoReplaceFlagAndUnremovableName)$
          pkg: ^github\.com/tonimelisma/onedrive-go/internal/synctree$
          msg: this synctree.Root models another system and is for tests only
        # A method matches as <package>.<receiver type>.<method>, so this
        # holds for a *testing.T in a struct field or passed as testing.TB,
        # whatever the variable is called. Nothing is exempt from it.
        - pattern: ^testing\.(T|B|F|TB)\.(Fatal|Fatalf|Error|Errorf)$
          pkg: ^testing$
          msg: use testify assert or require instead of direct testing failures
        # Product code prints through the writers internal/cli/root.go and
        # format.go own and logs through an injected *slog.Logger; one
        # exclusion rule below names the files these three rules do not bind.
        - pattern: ^slog\.(Debug|Info|Warn|Error)$
          pkg: ^log/slog$
          msg: pass an injected *slog.Logger instead of the package-level slog logger
        - pattern: ^os\.(Stdout|Stderr)$
          pkg: ^os$
          msg: write through the CLI-owned output and status writers
        - pattern: ^log\.Print(f|ln)?$
          pkg: ^log$
          msg: use the CLI-owned logger

    gocyclo:
      min-complexity: 15

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - paramTypeCombine
        - unnamedResult
        - whyNoLint
        - wrapperFunc
        - importShadow
      settings:
        hugeParam:
          # CanonicalID is 96 bytes (6 string fields) — an immutable value type
          # used as map keys and implementing encoding.TextMarshaler. Value
          # receivers are required; raising from 80 to 128 is appropriate.
          sizeThreshold: 128

    dupl:
      threshold: 100

    funlen:
      lines: 100
      statements: 50

    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
      ignored-numbers:
        - '0'
        - '1'
        - '2'
        - '3'
        - '200'
        - '201'
        - '400'
        - '401'
        - '403'
        - '404'
        - '429'
        - '500'

    goconst:
      min-len: 2
      min-occurrences: 2

    gosec:
      excludes:
        - G104
        - G115  # integer overflow: false positive on intentional truncation (quickxorhash)
        - G602  # slice bounds: false positive on backwards iteration (quickxorhash)

    lll:
      line-length: 140

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true

    staticcheck:
      checks: ["all", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]

    tagliatelle:
      case:
        rules:
          json: snake
          toml: snake
        overrides:
          - pkg: internal/graph
            rules:
              json: camel
            use-field-name: false
            ignored-fields:
              - ConflictBehavior
              - DeltaLink
              - DownloadURL
              - NextLink

    unparam:
      check-exported: false

    wrapcheck:
      # The defaults, plus panicguard.Recovered: like errors.New it makes the
      # error (the account of a recovered panic), so there is nothing to wrap;
      # and localpath.JoinOnOneLine: like errors.Join it joins two errors its
      # caller has already wrapped.
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - panicguard.Recovered(
        - localpath.JoinOnOneLine(

    whitespace:
      multi-if: false
      multi-func: false

    exhaustive:
      default-signifies-exhaustive: false

    errcheck:
      check-type-assertions: true
      check-blank: true

  exclusions:
    generated: lax
    warn-unused: true
    rules:
      - linters:
          - gocritic
        text: "unnecessaryDefer:"
      # Test mock implementations mirror interfaces and can't be shortened
      - linters:
          - lll
        path: _test\.go
      # Reader-side defer-close in tests only. CLAUDE.md requires checking
      # Close() on anything written to, because Close flushes buffers and a
      # dropped error there is silent data loss. Production code carries a
      # justified //nolint:errcheck at each reader-side close instead of a
      # blanket rule, so a new write-close is caught by default. Tests are not
      # the data-integrity boundary and would otherwise need the same
      # annotation on every fixture teardown.
      - path: _test\.go
        linters:
          - errcheck
        source: "defer "
      - path: _test\.go
        linters:
          - forbidigo
        text: use fsroot, synctree, or localpath filesystem boundaries instead of raw os\.\* calls
      - path: internal/devtool/
        linters:
          - forbidigo
        text: use fsroot, synctree, or localpath filesystem boundaries instead of raw os\.\* calls
      - path-except: _test\.go
        linters:
          - forbidigo
        text: use explicit test synchronization instead of wall-clock sleep
      - path: _test\.go
        linters:
          - forbidigo
        text: models another system and is for tests only
      # The filesystem boundary packages make the raw os.* calls; every other
      # forbidigo rule holds in them.
      - path: internal/(fsroot|synctree|localpath)/
        linters:
          - forbidigo
        text: use fsroot, synctree, or localpath filesystem boundaries instead of raw os\.\* calls
      # The output rules bind product code: not tests, the verification tool,
      # the live suite or testutil, and not the two files of internal/cli that
      # own the output and status writers.
      - path: (_test\.go|^internal/cli/(root|format)\.go)$|^(cmd/devtool|internal/devtool|e2e|testutil)/
        linters:
          - forbidigo
        text: (pass an injected \*slog\.Logger instead of the package-level slog logger|write through the CLI-owned output and status writers|use the CLI-owned logger)
      # The JSON output rule binds internal/cli alone, and there neither its
      # tests (they build fixtures and decode output) nor json_output.go, which
      # owns the encoder. control_request.go holds the one other encode in the
      # package and nothing else: the request body the CLI sends to the
      # running sync over the control socket, which is not output.
      - path-except: internal/cli/
        linters:
          - forbidigo
        text: encode command output only through writeJSONDocument
      - path: (_test\.go|internal/cli/json_output\.go|internal/cli/control_request\.go)$
        linters:
          - forbidigo
        text: encode command output only through writeJSONDocument
      - path: internal/devtool/(fsutil|live_env)\.go
        linters:
          - gosec
