version: "2"

run:
  # The deadline of a linter started by hand. `devtool verify` passes its own
  # --timeout over this one: this value on a host with at least 3 cores, and a
  # longer one below, where a cold whole-repo run beside other work has taken
  # more than 15 minutes. A devtool test keeps the two base values equal.
  timeout: 15m
  modules-download-mode: readonly
  # Live-test code is build-tagged; without these tags lint never sees it.
  build-tags:
    - e2e
    - e2e_full
    - integration

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/tonimelisma/onedrive-go

linters:
  default: none
  enable:
    - bodyclose
    - containedctx
    - copyloopvar
    - contextcheck
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - loggercheck
    - misspell
    - mnd
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - perfsprint
    - nolintlint
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - tagliatelle
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - whitespace
    - wrapcheck

  settings:
    # An error whose message has no format verb is errors.New: perfsprint's
    # errorf check alone, its other rewrites of fmt calls left off.
    perfsprint:
      integer-format: false
      int-conversion: false
      error-format: true
      err-error: false
      errorf: true
      string-format: false
      sprintf1: false
      strconcat: false
      bool-format: false
      hex-format: false
      concat-loop: false
    govet:
      enable-all: true
      disable:
        - fieldalignment

    depguard:
      rules:
        main:
          files:
            - "**/*.go"
          allow:
            - $gostd
            - github.com/tonimelisma/onedrive-go
            - github.com/BurntSushi/toml
            - github.com/stretchr/testify
            - golang.org/x/oauth2
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            - github.com/inconshreveable/mousetrap
            - golang.org/x/text
            - golang.org/x/time
            - modernc.org/sqlite
            - modernc.org/libc
            - modernc.org/mathutil
            - modernc.org/memory
            - github.com/pressly/goose/v3
            - github.com/google/uuid
            - github.com/fsnotify/fsnotify
            - github.com/coder/websocket
            - golang.org/x/sync
            - github.com/mattn/go-isatty
            - golang.org/x/sys
        # depguard matches files patterns against each file's absolute path,
        # so a path-scoped rule names its files from "**/"; a pattern relative
        # to the repository never matches and leaves its rule off
        # (TestGolangciConfig_DepguardFilePatternsMatchAbsolutePaths), and so
        # does one naming a folder that holds no package
        # (TestGolangciConfig_DepguardPackagePatternsNameExistingPackages).
        graph-no-config:
          files:
            - "**/internal/graph/*.go"
            - "!$test"
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/config$
              desc: graph boundary must not import internal/config
        driveops-no-sync:
          files:
            - "**/internal/driveops/*.go"
            - "!$test"
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync$
              desc: driveops must not import internal/sync
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync/
              desc: driveops must not import internal/sync
        # The sync tree's packages import one another in one direction
        # (spec/design/system.md, R-6.10.20): each rule allows the packages
        # of the tree its package may import and refuses the rest. Tests may
        # import more, so the rules leave them out; the compiler refuses a
        # cycle. TestGolangciConfig_EverySyncTreePackageHasItsImportRule holds
        # these rules to the tree.
        sync-domain-imports-nothing-of-the-tree:
          list-mode: lax
          files:
            - "**/internal/sync/syncdomain/*.go"
            - "!$test"
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync$
              desc: the vocabulary imports nothing of the sync tree
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync/
              desc: the vocabulary imports nothing of the sync tree
        sync-shortcut-only-domain:
          list-mode: lax
          files:
            - "**/internal/sync/syncshortcut/*.go"
            - "!$test"
          allow:
            - github.com/tonimelisma/onedrive-go/internal/sync/syncdomain$
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync$
              desc: the shortcut-root planners import the vocabulary alone
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync/
              desc: the shortcut-root planners import the vocabulary alone
        sync-store-only-domain-and-shortcut:
          list-mode: lax
          files:
            - "**/internal/sync/syncstore/*.go"
            - "!$test"
          allow:
            - github.com/tonimelisma/onedrive-go/internal/sync/syncdomain$
            - github.com/tonimelisma/onedrive-go/internal/sync/syncshortcut$
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync$
              desc: the store imports the vocabulary and the shortcut-root planners it runs in its transactions
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync/
              desc: the store imports the vocabulary and the shortcut-root planners it runs in its transactions
        sync-plan-only-domain:
          list-mode: lax
          files:
            - "**/internal/sync/internal/syncplan/*.go"
            - "!$test"
          allow:
            - github.com/tonimelisma/onedrive-go/internal/sync/syncdomain$
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync$
              desc: the planner imports the vocabulary alone, never the store, the observers or the executor
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync/
              desc: the planner imports the vocabulary alone, never the store, the observers or the executor
        sync-observe-only-domain-and-shortcut:
          list-mode: lax
          files:
            - "**/internal/sync/internal/syncobserve/*.go"
            - "!$test"
          allow:
            - github.com/tonimelisma/onedrive-go/internal/sync/syncdomain$
            - github.com/tonimelisma/onedrive-go/internal/sync/syncshortcut$
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync$
              desc: the observers import the vocabulary and the shortcut-root types, never the store, the planner or the executor
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync/
              desc: the observers import the vocabulary and the shortcut-root types, never the store, the planner or the executor
        sync-exec-only-domain:
          list-mode: lax
          files:
            - "**/internal/sync/internal/syncexec/*.go"
            - "!$test"
          allow:
            - github.com/tonimelisma/onedrive-go/internal/sync/syncdomain$
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync$
              desc: the executor imports the vocabulary alone and reaches the store through its own interface
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync/
              desc: the executor imports the vocabulary alone and reaches the store through its own interface
        sync-sched-only-domain:
          list-mode: lax
          files:
            - "**/internal/sync/internal/syncsched/*.go"
            - "!$test"
          allow:
            - github.com/tonimelisma/onedrive-go/internal/sync/syncdomain$
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync$
              desc: the scheduler imports the vocabulary alone
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync/
              desc: the scheduler imports the vocabulary alone
        sync-engine-no-test-helpers:
          list-mode: lax
          files:
            - "**/internal/sync/*.go"
            - "!$test"
          allow:
            - github.com/tonimelisma/onedrive-go/internal/sync/syncdomain$
            - github.com/tonimelisma/onedrive-go/internal/sync/syncshortcut$
            - github.com/tonimelisma/onedrive-go/internal/sync/syncstore$
            - github.com/tonimelisma/onedrive-go/internal/sync/internal/syncplan$
            - github.com/tonimelisma/onedrive-go/internal/sync/internal/syncobserve$
            - github.com/tonimelisma/onedrive-go/internal/sync/internal/syncexec$
            - github.com/tonimelisma/onedrive-go/internal/sync/internal/syncsched$
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync$
              desc: the engine imports its stage packages and its scheduler, never a test-helper package
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync/
              desc: the engine imports its stage packages and its scheduler, never a test-helper package
        sync-fixture-only-domain:
          list-mode: lax
          files:
            - "**/internal/sync/internal/syncfixture/*.go"
            - "!$test"
          allow:
            - github.com/tonimelisma/onedrive-go/internal/sync/syncdomain$
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync$
              desc: the shared test fixtures import the vocabulary alone, so every package's tests can import them
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync/
              desc: the shared test fixtures import the vocabulary alone, so every package's tests can import them
        sync-storetest-only-domain-store-and-fixture:
          list-mode: lax
          files:
            - "**/internal/sync/internal/syncstoretest/*.go"
            - "!$test"
          allow:
            - github.com/tonimelisma/onedrive-go/internal/sync/syncdomain$
            - github.com/tonimelisma/onedrive-go/internal/sync/syncshortcut$
            - github.com/tonimelisma/onedrive-go/internal/sync/syncstore$
            - github.com/tonimelisma/onedrive-go/internal/sync/internal/syncfixture$
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync$
              desc: the test-store helpers import the vocabulary, the store and the fixtures
            - pkg: github.com/tonimelisma/onedrive-go/internal/sync/
              desc: the test-store helpers import the vocabulary, the store and the fixtures
        multisync-no-graph:
          files:
            - "**/internal/multisync/*.go"
            - "!$test"
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/graph$
              desc: multisync owns runner lifecycle only and must not call Graph directly
        # The stored form of a name is computed in internal/namekey alone
        # (namekey.Stored, namekey.StoredPath); the test filesystem shim
        # models a normalizing volume with the normalizer itself.
        norm-only-namekey:
          files:
            - "**/*.go"
            - "!**/internal/namekey/*.go"
            - "!**/internal/synctest/*.go"
            - "!$test"
          deny:
            - pkg: golang.org/x/text/unicode/norm
              desc: compute a stored form with namekey.Stored or namekey.StoredPath
        # Every package that imports no internal package is held to it.
        leaf-internal:
          files:
            - "**/internal/authstate/*.go"
            - "**/internal/driveid/*.go"
            - "**/internal/errclass/*.go"
            - "**/internal/filelock/*.go"
            - "**/internal/humanunit/*.go"
            - "**/internal/localpath/*.go"
            - "**/internal/loglevel/*.go"
            - "**/internal/namekey/*.go"
            - "**/internal/panicguard/*.go"
            - "**/internal/sdnotify/*.go"
            - "**/internal/sharedref/*.go"
            - "!$test"
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/
              desc: leaf packages must not import other internal packages
        # A package with one internal dependency is held to that one. In lax
        # mode an import is refused when a deny prefix matches it, unless an
        # allow entry matches it with a longer prefix, so the exact allow below
        # wins over the internal/ deny for that one package alone.
        tokenfile-only-fsroot-and-filelock:
          list-mode: lax
          files:
            - "**/internal/tokenfile/*.go"
            - "!$test"
          allow:
            - github.com/tonimelisma/onedrive-go/internal/fsroot$
            - github.com/tonimelisma/onedrive-go/internal/filelock$
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/
              desc: tokenfile imports no internal package but fsroot, through which every token file is read and written, and filelock, through which it is locked
        retry-only-perf-and-humanunit:
          list-mode: lax
          files:
            - "**/internal/retry/*.go"
            - "!$test"
          allow:
            - github.com/tonimelisma/onedrive-go/internal/perf$
            - github.com/tonimelisma/onedrive-go/internal/humanunit$
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/
              desc: retry imports no internal package but perf, which counts its retries, and humanunit, which words its waits
        fsroot-only-localpath:
          list-mode: lax
          files:
            - "**/internal/fsroot/*.go"
            - "!$test"
          allow:
            - github.com/tonimelisma/onedrive-go/internal/localpath$
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/
              desc: fsroot imports no internal package but localpath, for its directory-sync errno test and its one-line join of two failures
        # The verification tool, tests included, imports no product package:
        # the allow entry is longer than the deny, so lax mode passes
        # internal/devtool, which cmd/devtool runs, and that alone.
        devtool-no-product:
          list-mode: lax
          files:
            - "**/internal/devtool/**"
            - "**/cmd/devtool/**"
          allow:
            - github.com/tonimelisma/onedrive-go/internal/devtool$
          deny:
            - pkg: github.com/tonimelisma/onedrive-go/internal/
              desc: the verification tool must not link product packages

    forbidigo:
      analyze-types: true
      # golangci-lint turns this on by default, which skips every Example
      # function of a test file; an Example is test code like any other.
      exclude-godoc-examples: false
      forbid:
        - pattern: ^os\.(Open|OpenFile|ReadFile|WriteFile|Create|CreateTemp|Mkdir|MkdirAll|ReadDir|Stat|Lstat|Remove|RemoveAll|Rename|Chmod|Chtimes|Symlink|Readlink|Truncate)$
          msg: use fsroot, synctree, or localpath filesystem boundaries instead of raw os.* calls
        - pattern: ^time\.Sleep$
          msg: use explicit test synchronization instead of wall-clock sleep
        # testify's Never and Consistently prove an absence by a fixed wait,
        # which a loaded host passes whether the product is right or wrong
        # (spec/design/system.md, the wait rules). A method of Assertions
        # matches as <package>.Assertions.<method>, and an aliased import
        # still names its package. Nothing is exempt from it.
        - pattern: ^(assert|require)\.(Assertions\.)?(Never|Neverf|Consistently|Consistentlyf)$
          pkg: ^github\.com/stretchr/testify/(assert|require)$
          msg: prove an absence by waiting for the signal that the input was handled, never by a fixed wait
        # The sync engine reads time through its SyncClock, so a model can
        # run it on a fake clock. The exclusions below scope this to the
        # non-test files of internal/sync and name the clock's own files.
        - pattern: ^time\.(Now|Since|Until|NewTimer|NewTicker|AfterFunc|After|Tick)$
          msg: read time through the engine's SyncClock (syncdomain/domain_clock.go), not the wall clock
        # Every byte of JSON a command prints is encoded in
        # internal/cli/json_output.go (writeJSONDocument, writeJSONLine). The
        # exclusion rules below scope this to the non-test files of
        # internal/cli and name its exceptions.
        - pattern: ^json\.(NewEncoder|Marshal|MarshalIndent)$
          pkg: ^encoding/json$
          msg: encode command output only through writeJSONDocument or writeJSONLine in internal/cli/json_output.go
        - pattern: ^synctree\.Root\.(WithoutNoReplaceFlagOrHardLinks|WithoutNoReplaceFlagAndUnremovableName)$
          pkg: ^github\.com/tonimelisma/onedrive-go/internal/synctree$
          msg: this synctree.Root models another system and is for tests only
        # A method matches as <package>.<receiver type>.<method>, so this
        # holds for a *testing.T in a struct field or passed as testing.TB,
        # whatever the variable is called. Nothing is exempt from it.
        - pattern: ^testing\.(T|B|F|TB)\.(Fatal|Fatalf|Error|Errorf)$
          pkg: ^testing$
          msg: use testify assert or require instead of direct testing failures
        # Product code prints through the writers internal/cli/root.go and
        # format.go own and logs through an injected *slog.Logger; one
        # exclusion rule below names the files these three rules do not bind.
        - pattern: ^slog\.(Debug|Info|Warn|Error)$
          pkg: ^log/slog$
          msg: pass an injected *slog.Logger instead of the package-level slog logger
        - pattern: ^os\.(Stdout|Stderr)$
          pkg: ^os$
          msg: write through the CLI-owned output and status writers
        - pattern: ^log\.Print(f|ln)?$
          pkg: ^log$
          msg: use the CLI-owned logger

    gocyclo:
      min-complexity: 15

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - paramTypeCombine
        - unnamedResult
        - whyNoLint
        - wrapperFunc
        - importShadow
      settings:
        hugeParam:
          # CanonicalID is 96 bytes (6 string fields) — an immutable value type
          # used as map keys and implementing encoding.TextMarshaler. Value
          # receivers are required; raising from 80 to 128 is appropriate.
          sizeThreshold: 128

    dupl:
      threshold: 100

    funlen:
      lines: 100
      statements: 50

    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
      ignored-numbers:
        - '0'
        - '1'
        - '2'
        - '3'
        - '200'
        - '201'
        - '400'
        - '401'
        - '403'
        - '404'
        - '429'
        - '500'

    goconst:
      min-len: 2
      min-occurrences: 2

    gosec:
      excludes:
        - G104
        - G115  # integer overflow: false positive on intentional truncation (quickxorhash)
        - G602  # slice bounds: false positive on backwards iteration (quickxorhash)

    lll:
      line-length: 140

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true

    staticcheck:
      checks: ["all", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]

    tagliatelle:
      case:
        rules:
          json: snake
          toml: snake
        overrides:
          - pkg: internal/graph
            rules:
              json: camel
            use-field-name: false
            ignored-fields:
              - ConflictBehavior
              - DeltaLink
              - DownloadURL
              - NextLink

    unparam:
      check-exported: false

    wrapcheck:
      # The defaults, plus panicguard.Recovered: like errors.New it makes the
      # error (the account of a recovered panic), so there is nothing to wrap;
      # and localpath.JoinOnOneLine: like errors.Join it joins two errors its
      # caller has already wrapped.
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - panicguard.Recovered(
        - localpath.JoinOnOneLine(

    whitespace:
      multi-if: false
      multi-func: false

    exhaustive:
      default-signifies-exhaustive: false

    errcheck:
      check-type-assertions: true
      check-blank: true

  exclusions:
    generated: lax
    warn-unused: true
    rules:
      - linters:
          - gocritic
        text: "unnecessaryDefer:"
      # Test mock implementations mirror interfaces and can't be shortened
      - linters:
          - lll
        path: _test\.go
      # Reader-side defer-close in tests only. CLAUDE.md requires checking
      # Close() on anything written to, because Close flushes buffers and a
      # dropped error there is silent data loss. Production code carries a
      # justified //nolint:errcheck at each reader-side close instead of a
      # blanket rule, so a new write-close is caught by default. Tests are not
      # the data-integrity boundary and would otherwise need the same
      # annotation on every fixture teardown.
      - path: _test\.go
        linters:
          - errcheck
        source: "defer "
      - path: _test\.go
        linters:
          - forbidigo
        text: use fsroot, synctree, or localpath filesystem boundaries instead of raw os\.\* calls
      - path: internal/devtool/
        linters:
          - forbidigo
        text: use fsroot, synctree, or localpath filesystem boundaries instead of raw os\.\* calls
      - path-except: _test\.go
        linters:
          - forbidigo
        text: use explicit test synchronization instead of wall-clock sleep
      - path: _test\.go
        linters:
          - forbidigo
        text: models another system and is for tests only
      # The wall-clock ban binds the sync engine's product code only. The
      # clock file and the debounce timer are the wall clock's
      # implementations; the test-helper packages are test code.
      - path-except: ^internal/sync/
        linters:
          - forbidigo
        text: read time through the engine's SyncClock
      - path: (_test\.go|^internal/sync/syncdomain/domain_clock\.go|^internal/sync/internal/syncobserve/buffer\.go|^internal/sync/internal/(syncfixture|syncstoretest)/)
        linters:
          - forbidigo
        text: read time through the engine's SyncClock
      # The sync tree's test-helper packages are test code that is not in
      # _test.go files: they keep the exemptions tests have.
      - path: internal/sync/internal/(syncfixture|syncstoretest)/
        linters:
          - lll
          - mnd
      - path: internal/sync/internal/(syncfixture|syncstoretest)/
        linters:
          - forbidigo
        text: use fsroot, synctree, or localpath filesystem boundaries instead of raw os\.\* calls
      # A call between two packages of the sync tree was a call inside one
      # package before the split, and its error was returned as it is. The
      # exclusion is anchored on the callee: a function of the tree or a
      # method of one of its concrete types (pointer receiver). Calls from cli
      # and multisync into the tree stay checked, and so does a call through
      # an interface the tree declares, whose implementation may be anyone's.
      - path: internal/sync/
        linters:
          - wrapcheck
        text: 'sig: func (\(\*)?github\.com/tonimelisma/onedrive-go/internal/sync(/[a-z/]+)?\.[A-Za-z_]'
      # The filesystem boundary packages make the raw os.* calls; every other
      # forbidigo rule holds in them.
      - path: internal/(fsroot|synctree|localpath)/
        linters:
          - forbidigo
        text: use fsroot, synctree, or localpath filesystem boundaries instead of raw os\.\* calls
      # The output rules bind product code: not tests, the verification tool,
      # the live suite or testutil, and not the two files of internal/cli that
      # own the output and status writers.
      - path: (_test\.go|^internal/cli/(root|format)\.go)$|^(cmd/devtool|internal/devtool|e2e|testutil)/
        linters:
          - forbidigo
        text: (pass an injected \*slog\.Logger instead of the package-level slog logger|write through the CLI-owned output and status writers|use the CLI-owned logger)
      # The JSON output rule binds internal/cli alone, and there neither its
      # tests (they build fixtures and decode output) nor json_output.go, which
      # owns the encoder. control_request.go holds the one other encode in the
      # package and nothing else: the request body the CLI sends to the
      # running sync over the control socket, which is not output.
      - path-except: internal/cli/
        linters:
          - forbidigo
        text: encode command output only through writeJSONDocument
      - path: (_test\.go|internal/cli/json_output\.go|internal/cli/control_request\.go)$
        linters:
          - forbidigo
        text: encode command output only through writeJSONDocument
      - path: internal/devtool/(fsutil|live_env)\.go
        linters:
          - gosec
